[package]
name = "lance-namespace"
description = "Lance Namespace Core APIs"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = []
# Re-export the generated REST API client (`apis`) and pull in its reqwest
# stack. Off by default so consumers that only touch directory namespaces
# (which use `models` only) don't compile reqwest/url.
client = ["lance-namespace-reqwest-client/client"]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
arrow.workspace = true
lance-core.workspace = true
snafu.workspace = true
lance-namespace-reqwest-client.workspace = true

[lints]
workspace = true
